[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastbrainage"
version = "0.1.0"
description = "Reusable FastSPM retrained brain-age workflow"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "joblib==1.5.3",
  "nibabel==5.4.2",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scikit-learn==1.8.0",
  "scipy==1.17.1",
]

[project.scripts]
fastbrainage = "fastbrainage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fastbrainage = []
